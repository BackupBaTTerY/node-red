<script type="text/javascript">
    RED.nodes.registerType('energypriceforecast-prices', {
        category: 'Energy Price Forecast',
        color: '#f3b33d',
        defaults: {
            name: { value: '' },
            connection: { value: '', type: 'energypriceforecast-config', required: true },
            market: { value: 'DE', required: true },
            hours: { value: 48, required: true, validate: RED.validators.number() },
            mode: { value: 'mixed', required: true },
            resolution: { value: '15m', required: true },
            currency: { value: 'auto', required: true },
            priceMode: { value: 'base', required: true },
            postalCode: { value: '' },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-line-chart',
        align: 'left',
        label: function () {
            return this.name || `EPF prices · ${this.market || 'DE'}`;
        },
        paletteLabel: 'EPF prices',
        oneditprepare: function () {
            const updatePostalCode = function () {
                $('#epf-prices-postal-code-row').toggle($('#node-input-priceMode').val() === 'retail');
            };
            $('#node-input-priceMode').on('change', updatePostalCode);
            updatePostalCode();
        },
    });
</script>

<script type="text/html" data-help-name="energypriceforecast-prices">
    <p>Gets the price series for charts, thresholds and custom scheduling logic.</p>
    <h3>Input</h3>
    <p>Any message triggers one request. Optional properties in <code>msg.epf</code> override the editor settings: <code>market</code>, <code>hours</code>, <code>mode</code>, <code>resolution</code>, <code>currency</code>, <code>priceMode</code> and <code>postalCode</code>.</p>
    <h3>Output</h3>
    <p><code>msg.payload.entries</code> contains the complete series. <code>msg.energypriceforecast</code> provides <code>entryCount</code>, <code>seriesStart</code>, <code>seriesEnd</code>, horizon and API-key metadata.</p>
    <p>With 15-minute resolution, hourly forecast values are repeated for four slots and are never interpolated. The response marks the native source resolution.</p>
    <p>Request failures are sent to a Catch node. No stale success message is emitted.</p>
</script>
