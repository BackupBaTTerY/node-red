<script type="text/javascript">
    RED.nodes.registerType('energypriceforecast-summary', {
        category: 'Energy Price Forecast',
        color: '#f3b33d',
        defaults: {
            name: { value: '' },
            connection: { value: '', type: 'energypriceforecast-config', required: true },
            market: { value: 'DE', required: true },
            hours: { value: 48, required: true, validate: RED.validators.number() },
            windowHours: { value: 4, required: true, validate: RED.validators.number() },
            priceMode: { value: 'base', required: true },
            postalCode: { value: '' },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-bolt',
        align: 'left',
        label: function () {
            return this.name || `EPF summary · ${this.market || 'DE'}`;
        },
        paletteLabel: 'EPF summary',
        oneditprepare: function () {
            const updatePostalCode = function () {
                $('#epf-summary-postal-code-row').toggle($('#node-input-priceMode').val() === 'retail');
            };
            $('#node-input-priceMode').on('change', updatePostalCode);
            updatePostalCode();
        },
    });
</script>

<script type="text/html" data-help-name="energypriceforecast-summary">
    <p>Gets the compact automation summary: current price and CO2 intensity, cheapest and greenest windows, combined score, forecast quality and access metadata.</p>
    <h3>Input</h3>
    <p>Any message triggers one request. Optional per-message settings in <code>msg.epf</code> override the editor settings:</p>
    <pre>{
  "market": "NL",
  "hours": 72,
  "windowHours": 3,
  "priceMode": "retail",
  "postalCode": "1012"
}</pre>
    <p>The API key and API URL cannot be overridden by a message.</p>
    <h3>Output</h3>
    <p><code>msg.payload</code> contains the complete API response. Frequently used values are also mapped to <code>msg.energypriceforecast</code>, including:</p>
    <ul>
        <li><code>currentPrice</code>, <code>currentPriceUnit</code>, <code>currentPriceSource</code></li>
        <li><code>currentCo2GPerKwh</code></li>
        <li><code>cheapestWindowStart</code>, <code>cheapestWindowEnd</code>, <code>isCheapestWindowNow</code></li>
        <li><code>greenestWindowStart</code>, <code>isGreenestWindowNow</code></li>
        <li><code>combinedScoreNow</code>, <code>apiKeyState</code>, <code>usedHorizonHours</code></li>
    </ul>
    <p>Request failures are sent to a Catch node. No stale success message is emitted.</p>
</script>
